name: Deploy demo to GitHub Pages

# Publishes the live demo: the full portal with its API running inside the visitor's browser
# (frontend/src/demo), so no server or database is needed. Every visitor gets private sample data.
#
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → Variables → DEMO_CONTACT_URL
#           (e.g. https://wa.me/905xxxxxxxxx) shows a "Buy / contact" button in the demo.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build demo
        working-directory: frontend
        env:
          # With a custom domain the site lives at "/", otherwise at "/<repository-name>/".
          VITE_BASE_PATH: ${{ secrets.CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_DEMO_CONTACT_URL: ${{ vars.DEMO_CONTACT_URL }}
        run: |
          npm run build:demo
          # Deep links (e.g. a table's QR menu) are served by the SPA through GitHub Pages' 404 page.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
